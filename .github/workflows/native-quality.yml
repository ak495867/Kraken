name: native-quality

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  native-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pybind11-dev
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - id: baseline
        shell: bash
        run: |
          base_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "use_static=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_static=false" >> "$GITHUB_OUTPUT"
            echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.baseline.outputs.use_static != 'true'
        run: git worktree add --detach ../kraken-baseline "${{ steps.baseline.outputs.sha }}"
      - if: steps.baseline.outputs.use_static != 'true'
        run: cmake -S ../kraken-baseline -B ../kraken-baseline/build/native -DBUILD_TESTING=OFF -DKRAKEN_BUILD_BENCHMARKS=ON
      - if: steps.baseline.outputs.use_static != 'true'
        run: cmake --build ../kraken-baseline/build/native --parallel 2
      - if: steps.baseline.outputs.use_static != 'true'
        run: python tools/stable_benchmark.py --benchmark ../kraken-baseline/build/native/kraken_large_history_benchmark --observations 200000 --iterations 3 --samples 9 --attempts 3 --output build/native/base-benchmark.csv
      - run: cmake -S . -B build/native -DBUILD_TESTING=ON -DKRAKEN_BUILD_BENCHMARKS=ON
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: python tools/stable_benchmark.py --benchmark build/native/kraken_large_history_benchmark --observations 200000 --iterations 3 --samples 9 --attempts 3 --output build/native/benchmark.csv
      - shell: bash
        run: |
          baseline_path="benchmarks/baseline_gcc13_linux.csv"
          if [ "${{ steps.baseline.outputs.use_static }}" != "true" ]; then
            baseline_path="build/native/base-benchmark.csv"
          fi
          python tools/compare_benchmarks.py --baseline "$baseline_path" --candidate build/native/benchmark.csv --policy ci/performance_thresholds.json --output build/native/performance_comparison.json
      - if: steps.baseline.outputs.use_static != 'true'
        run: git worktree remove --force ../kraken-baseline
      - run: python -m build --outdir dist
      - run: python -m venv /tmp/kraken-wheel-smoke
      - run: /tmp/kraken-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/kraken-wheel-smoke/bin/python tools/wheel_smoke.py
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*.tar.gz

  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --outdir dist
      - run: python -m venv .wheel-smoke
      - if: runner.os == 'Windows'
        run: .wheel-smoke\Scripts\python tools\install_wheel.py
      - if: runner.os != 'Windows'
        run: .wheel-smoke/bin/python tools/install_wheel.py
      - if: runner.os == 'Windows'
        run: .wheel-smoke\Scripts\python tools\wheel_smoke.py
      - if: runner.os != 'Windows'
        run: .wheel-smoke/bin/python tools/wheel_smoke.py
      - if: runner.os == 'Windows'
        run: .wheel-smoke\Scripts\python -m unittest discover -s tests -v
      - if: runner.os != 'Windows'
        run: .wheel-smoke/bin/python -m unittest discover -s tests -v
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-quality, packaging]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: python tools/check_release.py --dist dist --tag "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
